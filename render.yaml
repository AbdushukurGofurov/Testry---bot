services:
  - type: web
    name: testry-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "6121307128"
      - key: DATABASE_URL
        fromDatabase:
          name: testry-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: testry-db
    plan: free
    databaseName: testry
    user: testry
