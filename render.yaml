services:
  - type: worker
    name: testry-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: testry-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "6121307128"
      - key: DB_PATH
        value: /data/testry.db
      - key: PRICE_TEXT
        sync: false
      - key: PAYMENT_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
